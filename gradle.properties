org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Reuse cacheable Android/Kotlin task outputs locally and through setup-gradle in CI.
org.gradle.caching=true
# The build has two independent Android modules; cap workers to leave memory for the IDE/emulator.
org.gradle.parallel=true
org.gradle.workers.max=4
# Reuse configured task graphs for repeated local and CI invocations.
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
ksp.useKSP2=false
