name: Optional downstream compatibility (Plan and Puanla)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    name: Prepare candidate Compose AAR for optional downstream tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Stage local SNAPSHOT Maven AAR
        run: ./gradlew :design-system:publishReleasePublicationToStagingRepository --no-daemon
      - name: Upload staging Maven repository for Plan and Puanla
        uses: actions/upload-artifact@v4
        with:
          name: compose-p0-maven-staging
          path: build/p0-maven-repository/
          if-no-files-found: error
          retention-days: 7

  downstream-check:
    name: Optional Plan and Puanla compatibility
    needs: stage
    uses: ./.github/workflows/consumer-compat.yml
    with:
      library_version: 0.1.0-SNAPSHOT
