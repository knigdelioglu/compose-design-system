name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build library and gallery
        run: ./gradlew :design-system:assembleDebug :gallery:assembleDebug
      - name: Run JVM tests
        run: ./gradlew :design-system:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew :design-system:lintDebug :gallery:lintDebug
      - name: Check Kotlin public API compatibility
        run: ./gradlew :design-system:apiCheck

  compose-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-35;google_apis;x86_64'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Compose UI tests on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: ./gradlew :design-system:connectedDebugAndroidTest
