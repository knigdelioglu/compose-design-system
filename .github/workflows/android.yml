name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build library and gallery
        run: ./gradlew :design-system:assembleDebug :gallery:assembleDebug
      - name: Run JVM tests
        run: ./gradlew :design-system:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew :design-system:lintDebug :gallery:lintDebug
      - name: Check Kotlin public API compatibility
        run: ./gradlew :design-system:apiCheck
      - name: Publish release AAR to isolated Maven staging repository
        run: ./gradlew :design-system:publishReleasePublicationToStagingRepository
      - name: Validate Maven artifact and metadata exist
        run: |
          echo "Published Maven repository files:"
          find build/p0-maven-repository -maxdepth 8 -type f | sort | head -60
          test -f build/p0-maven-repository/com/knigdelioglu/compose-design-system/0.1.0-SNAPSHOT/compose-design-system-0.1.0-SNAPSHOT.aar
          test -f build/p0-maven-repository/com/knigdelioglu/compose-design-system/0.1.0-SNAPSHOT/compose-design-system-0.1.0-SNAPSHOT.pom
      - name: Compile gallery against published Maven artifact (not a project dependency)
        run: ./gradlew :gallery:assembleDebug -PcomposeSmokePublished=true
      - name: Export P0 Maven repository for pre-release consumer tests
        uses: actions/upload-artifact@v4
        with:
          name: compose-p0-maven-staging
          path: build/p0-maven-repository/
          if-no-files-found: error
          retention-days: 7

  compose-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-35;google_apis;x86_64'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run Compose UI tests on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: ./gradlew :design-system:connectedDebugAndroidTest

  published-consumer-tests:
    name: Published AAR compatibility (${{ matrix.consumer }})
    if: github.event_name == 'pull_request'
    needs: build-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - consumer: Plan
            repo: knigdelioglu/plan
            path: plan
            working_directory: plan/android
            ref: codex/p0-library-consumer-20261013
          - consumer: Puanla
            repo: knigdelioglu/puanla
            path: puanla
            working_directory: puanla
            ref: codex/p0-library-consumer-20261013
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: ${{ matrix.path }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: compose-p0-maven-staging
          path: staged-maven
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build application against independent staged AAR
        working-directory: ${{ matrix.working_directory }}
        env:
          ORG_GRADLE_PROJECT_composePublishedVersion: 0.1.0-SNAPSHOT
          ORG_GRADLE_PROJECT_composePublishedRepositoryDir: ${{ github.workspace }}/staged-maven
        run: ./gradlew :app:assembleDebug testDebugUnitTest :app:assembleDebugAndroidTest --no-daemon
