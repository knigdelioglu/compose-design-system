name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build library and gallery
        run: ./gradlew :design-system:assembleDebug :gallery:assembleDebug
      - name: Run JVM tests
        run: ./gradlew :design-system:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew :design-system:lintDebug :gallery:lintDebug
      - name: Check Kotlin public API compatibility
        run: ./gradlew :design-system:apiCheck
      - name: Publish release AAR to isolated Maven staging repository
        run: ./gradlew :design-system:publishReleasePublicationToStagingRepository
      - name: Validate Maven artifact and metadata exist
        run: |
          echo "Published Maven repository files:"
          find build/p0-maven-repository -maxdepth 8 -type f | sort | head -60
          publication="build/p0-maven-repository/com/knigdelioglu/compose-design-system/0.1.0-SNAPSHOT"
          test -s "$publication/maven-metadata.xml"
          # File-backed Maven SNAPSHOT repositories use timestamped artifact filenames.
          find "$publication" -maxdepth 1 -type f -name '*.aar' | grep -q .
          find "$publication" -maxdepth 1 -type f -name '*.pom' | grep -q .
          find "$publication" -maxdepth 1 -type f -name '*.module' | grep -q .
      - name: Compile gallery against published Maven artifact (not a project dependency)
        run: ./gradlew :gallery:assembleDebug -PcomposeSmokePublished=true
      - name: Export P0 Maven repository for pre-release consumer tests
        uses: actions/upload-artifact@v4
        with:
          name: compose-p0-maven-staging
          path: build/p0-maven-repository/
          if-no-files-found: error
          retention-days: 7

  library-ui-tests:
    name: Compose library Android emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable Android emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [[ -c /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
      - name: Run Compose library UI tests independently of applications
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :design-system:connectedDebugAndroidTest --no-daemon
