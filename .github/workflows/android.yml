name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build library and gallery
        run: ./gradlew :design-system:assembleDebug :gallery:assembleDebug
      - name: Run JVM tests
        run: ./gradlew :design-system:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew :design-system:lintDebug :gallery:lintDebug
      - name: Check Kotlin public API compatibility
        run: ./gradlew :design-system:apiCheck
      - name: Publish release AAR to isolated Maven staging repository
        run: ./gradlew :design-system:publishReleasePublicationToStagingRepository
      - name: Validate Maven artifact and metadata exist
        run: |
          echo "Published Maven repository files:"
          find build/p0-maven-repository -maxdepth 8 -type f | sort | head -60
          publication="build/p0-maven-repository/com/knigdelioglu/compose-design-system/0.1.0-SNAPSHOT"
          test -s "$publication/maven-metadata.xml"
          # File-backed Maven SNAPSHOT repositories use timestamped artifact filenames.
          find "$publication" -maxdepth 1 -type f -name '*.aar' | grep -q .
          find "$publication" -maxdepth 1 -type f -name '*.pom' | grep -q .
          find "$publication" -maxdepth 1 -type f -name '*.module' | grep -q .
      - name: Compile gallery against published Maven artifact (not a project dependency)
        run: ./gradlew :gallery:assembleDebug -PcomposeSmokePublished=true
      - name: Export P0 Maven repository for pre-release consumer tests
        uses: actions/upload-artifact@v4
        with:
          name: compose-p0-maven-staging
          path: build/p0-maven-repository/
          if-no-files-found: error
          retention-days: 7

  published-consumer-tests:
    name: Plan and Puanla binary emulator acceptance
    needs: build-and-unit-tests
    uses: ./.github/workflows/consumer-compat.yml
    with:
      library_version: 0.1.0-SNAPSHOT
