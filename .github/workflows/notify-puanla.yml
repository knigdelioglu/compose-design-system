name: Notify Puanla of verified Compose updates

on:
  workflow_run:
    workflows: [Android]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify-puanla:
    # Puanla only considers commits that passed Compose's own Android CI.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch cross-repository sync when token is configured
        env:
          PUANLA_DISPATCH_TOKEN: ${{ secrets.PUANLA_DISPATCH_TOKEN }}
          COMPOSE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PUANLA_DISPATCH_TOKEN" ]]; then
            echo "::notice::Set PUANLA_DISPATCH_TOKEN (fine-grained token with Puanla Contents: write) for immediate updates. Puanla also checks Compose hourly without it."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer $PUANLA_DISPATCH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/knigdelioglu/puanla/dispatches" \
            --data "{\"event_type\":\"compose-design-system-updated\",\"client_payload\":{\"compose_sha\":\"$COMPOSE_SHA\"}}"
